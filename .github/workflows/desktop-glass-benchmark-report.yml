name: Desktop Glass Benchmark Report

on:
  workflow_run:
    workflows: [Desktop Glass Benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out trusted reporter
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download benchmark
        uses: actions/download-artifact@v8
        with:
          name: desktop-glass-benchmark
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Maintain PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const run = context.payload.workflow_run
            const prNumber = run.pull_requests[0]?.number
            if (!prNumber) return

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            })
            if (pr.head.sha !== run.head_sha) return

            const path = 'artifact/benchmark.json'
            if (fs.statSync(path).size > 1024 * 1024) throw new Error('Benchmark report is too large')
            const report = JSON.parse(fs.readFileSync(path, 'utf8'))
            const reporter = await import(
              pathToFileURL('.github/scripts/desktop-glass-benchmark-report.mjs').href,
            )
            const body = reporter.renderComment(
              reporter.validateReport(report, pr.head.sha),
              run.html_url,
            )
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            })
            const selection = reporter.selectMarkerComment(comments)
            if (selection.operation === 'update') {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: selection.commentId,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              })
            }
