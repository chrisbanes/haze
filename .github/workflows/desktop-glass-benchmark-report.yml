name: Desktop Glass Benchmark Report

on:
  workflow_run:
    workflows: [Desktop Glass Benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out trusted reporter
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download Desktop Glass benchmark
        uses: actions/download-artifact@v8
        with:
          name: desktop-glass-benchmark
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate results and maintain PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const { pathToFileURL } = require('node:url')
            const workflowRun = context.payload.workflow_run
            const prNumber = workflowRun.pull_requests[0]?.number
            if (!prNumber) {
              core.notice('The completed workflow run is not associated with a pull request')
              return
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            })
            if (pr.head.sha !== workflowRun.head_sha) {
              core.notice('Ignoring a stale benchmark run for an earlier pull-request head')
              return
            }

            const body = execFileSync('node', [
              '.github/scripts/desktop-glass-benchmark-report.mjs',
              'artifact/benchmark.json',
              `${context.repo.owner}/${context.repo.repo}`,
              pr.base.sha,
              pr.head.sha,
              workflowRun.html_url,
            ], {
              encoding: 'utf8',
              maxBuffer: 1024 * 1024,
            })

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            })
            const reporter = await import(
              pathToFileURL('.github/scripts/desktop-glass-benchmark-report.mjs').href,
            )
            const selection = reporter.selectMarkerComment(comments)
            if (selection.operation === 'update') {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: selection.commentId,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              })
            }
