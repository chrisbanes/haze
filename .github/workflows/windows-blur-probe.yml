name: Windows progressive blur probe

on:
  workflow_dispatch:
  # Branch-only bootstrap: a new workflow cannot be dispatched until it exists on main.
  push:
    branches: [cb/simplify-issue-1260-shader]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        renderer: [DIRECT3D, OPENGL, DIRECT_SOFTWARE]
    env:
      SKIKO_RENDER_API: ${{ matrix.renderer }}
      SKIKO_HARDWARE_INFO_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Graphics environment
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM, Status | Format-List
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List
      - name: Run unchanged progressive shader in two native windows
        shell: pwsh
        run: >-
          ./gradlew.bat :sample:desktop:spotlessCheck :sample:desktop:run
          -Phaze.disableAppleTargets -Phaze.windowsBlurProbe=true
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx2g' --max-workers=2 --no-scan --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-blur-${{ matrix.renderer }}
          path: sample/desktop/build/outputs/windows-blur-probe
          if-no-files-found: warn
