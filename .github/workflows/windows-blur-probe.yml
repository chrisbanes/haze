name: Windows progressive blur probe

on:
  workflow_dispatch:
  # Branch-only bootstrap: a new workflow cannot be dispatched until it exists on main.
  push:
    branches: [cb/simplify-issue-1260-shader]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [bound24, guarded]
    env:
      SKIKO_RENDER_API: DIRECT3D
      SKIKO_HARDWARE_INFO_ENABLED: 'true'
      HAZE_PROBE_WIDTH: '64'
      HAZE_PROBE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Graphics environment
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM, Status | Format-List
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List
      - name: Apply one-variable diagnostic change
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path('haze-utils/src/commonMain/kotlin/dev/chrisbanes/haze/ProgressiveBlurRenderEffect.kt')
          source = path.read_text()
          if os.environ['HAZE_PROBE_VARIANT'] == 'bound24':
              before = 'for (half i = 1.0; i < maxRadius; i += 2.0)'
              assert source.count(before) == 1
              source = source.replace(before, 'for (half i = 1.0; i < 24.0; i += 2.0)')
          else:
              before = 'if (i >= r) { break; }'
              end = '      }\n\n      // Check if radius is odd'
              assert source.count(before) == source.count(end) == 1
              source = source.replace(before, 'if (!(i >= r)) {')
              source = source.replace(end, '        }\n' + end)
          path.write_text(source)
          print('Diagnostic variant:', os.environ['HAZE_PROBE_VARIANT'])
      - name: Run unchanged progressive shader in two native windows
        shell: pwsh
        run: >-
          ./gradlew.bat :sample:desktop:spotlessCheck :sample:desktop:run
          '-Phaze.disableAppleTargets' '-Phaze.windowsBlurProbe=true'
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx2g' --max-workers=2 --no-scan --console=plain
      - name: Reject first-draw stalls
        run: python scripts/check_windows_blur_probe.py sample/desktop/build/outputs/windows-blur-probe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-blur-${{ matrix.variant }}
          path: sample/desktop/build/outputs/windows-blur-probe
          if-no-files-found: warn
