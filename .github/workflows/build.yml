name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v1
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac_build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Compile Apple targets, run iOS simulator and macOS host tests, link macOS sample
        run: >
          ./gradlew
          compileKotlinIosArm64 iosSimulatorArm64Test
          macosArm64Test :sample:macos:linkDebugExecutableMacosArm64
          -Phaze.enableAppleTests
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  linux_build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Assemble and check
        run: >
          ./gradlew check assembleDebug :haze-screenshot-tests:verifyScreenshotMatrixJvm
          -x :haze-screenshot-tests:testAndroidHostTest
          -Phaze.disableAppleTargets
          -Pandroidx.baselineprofile.skipgeneration
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Upload reports + Roborazzi outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-reports
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**

  screenshot_tests:
    name: Screenshot tests (android)
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Run screenshot tests
        run: >
          ./gradlew :haze-screenshot-tests:verifyScreenshotMatrixAndroid
          -Phaze.disableAppleTargets
          -Pandroidx.baselineprofile.skipgeneration
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Upload reports + Roborazzi outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: haze-screenshot-android-reports
          path: |
            haze-screenshot-tests/build/reports/**
            haze-screenshot-tests/build/outputs/roborazzi/**

  emulator_tests:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-snapshot-save
          script: ./gradlew connectedDebugAndroidTest connectedAndroidDeviceTest -Phaze.disableAppleTargets -Pandroidx.baselineprofile.skipgeneration

      - name: Verify SolidColor rendering XML evidence
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          class_name = "dev.chrisbanes.haze.blur.SolidColorBlurRenderEffectInstrumentationTest"
          expected = {
              "solidMask_matchesConstantShaderBrush",
              "solidProgressive_matchesConstantShaderBrush",
              "solidTint_matchesColorTint",
          }
          paths = list(Path("haze-blur/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          if not paths:
              raise SystemExit("Missing SolidColor rendering XML results")
          actual = []
          for path in paths:
              root = ET.parse(path).getroot()
              local_name = lambda node: node.tag.rsplit("}", 1)[-1]
              for case in root.iter():
                  if local_name(case) != "testcase" or case.get("classname") != class_name:
                      continue
                  if any(local_name(node) in ("failure", "error", "skipped") for node in case.iter()):
                      raise SystemExit(f"Unsuccessful SolidColor testcase in {path}: {case.attrib}")
                  actual.append(case.get("name"))
          if len(actual) != len(expected) or set(actual) != expected:
              raise SystemExit(f"Expected exactly three SolidColor rendering tests, got {actual}")
          print("Verified three SolidColor rendering tests, zero skips/failures/errors")
          PYTHON

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-reports
          path: |
            **/build/reports/androidTests/**
            **/build/reports/tests/**
            **/build/outputs/androidTest-results/**

  progressive_blur_regression:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 32]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-snapshot-save
          script: ./gradlew :haze-blur:connectedAndroidDeviceTest -Pandroid.testInstrumentationRunnerArguments.class=dev.chrisbanes.haze.blur.ProgressiveBlurBoundsInstrumentationTest,dev.chrisbanes.haze.blur.SolidColorBlurRenderEffectInstrumentationTest -Phaze.disableAppleTargets -Pandroidx.baselineprofile.skipgeneration

      - name: Verify progressive rendering XML evidence
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          class_name = "dev.chrisbanes.haze.blur.ProgressiveBlurBoundsInstrumentationTest"
          solid_class = "dev.chrisbanes.haze.blur.SolidColorBlurRenderEffectInstrumentationTest"
          expected = {
              (solid_class, "solidMask_matchesConstantShaderBrush"),
              (solid_class, "solidProgressive_matchesConstantShaderBrush"),
              (solid_class, "solidTint_matchesColorTint"),
              (class_name, "reverseHorizontal_matchesFiniteReference"),
              (class_name, "reverseVertical_matchesFiniteReference"),
              (class_name, "reverseDiagonal_matchesFiniteReference"),
          }
          paths = list(Path("haze-blur/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          if not paths:
              raise SystemExit("Missing progressive rendering XML results")
          actual = []
          for path in paths:
              root = ET.parse(path).getroot()
              local_name = lambda node: node.tag.rsplit("}", 1)[-1]
              summaries = [node for node in root.iter() if local_name(node) in ("testsuite", "testsuites")]
              if not summaries:
                  raise SystemExit(f"Missing test summary in {path}")
              for summary in summaries:
                  counts = {}
                  for field in ("tests", "failures", "errors", "skipped"):
                      value = summary.get(field, "")
                      if not value.isascii() or not value.isdigit():
                          raise SystemExit(f"Missing or invalid {field} in {path}")
                      counts[field] = int(value)
                  cases = [node for node in summary.iter() if local_name(node) == "testcase"]
                  if counts["tests"] != len(cases):
                      raise SystemExit(f"Inconsistent test count in {path}: {counts}")
                  if any(counts[field] for field in ("failures", "errors", "skipped")):
                      raise SystemExit(f"Unsuccessful test summary in {path}: {counts}")
              for case in root.iter():
                  if local_name(case) != "testcase":
                      continue
                  if any(local_name(node) in ("failure", "error", "skipped") for node in case.iter()):
                      raise SystemExit(f"Unsuccessful testcase in {path}: {case.attrib}")
                  actual.append((case.get("classname"), case.get("name")))
          if len(actual) != len(expected) or set(actual) != expected:
              raise SystemExit(f"Expected exactly six Blur rendering tests, got {actual}")
          print("Verified six Blur rendering tests, zero skips/failures/errors")
          PYTHON

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progressive-blur-api-${{ matrix.api-level }}
          path: |
            haze-blur/build/reports/androidTests/**
            haze-blur/build/reports/tests/**
            haze-blur/build/outputs/androidTest-results/**

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1'

    runs-on: macos-26
    needs:
      - linux_build
      - mac_build
      - screenshot_tests
      - emulator_tests
      - progressive_blur_regression
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Deploy to Sonatype
        run: ./gradlew publish --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: true
