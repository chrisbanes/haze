name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v1
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep publishing builds queued when a later docs-only push skips deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v1' }}
  queue: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') && 'max' || 'single' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_build: ${{ steps.changes.outputs.run_build }}
    steps:
      - uses: actions/checkout@v7

      - name: Test verification scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Detect code changes
        id: changes
        env:
          # A pull_request run checks out the merge commit, so diffing the base tip against
          # GITHUB_SHA covers exactly what the PR would add. Path filters would leave required
          # checks unreported on docs-only PRs; this job skips the heavy jobs instead.
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          run_build=true
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Fail closed: if the diff cannot be computed, run the full build.
            docs_only=$(sh scripts/is_docs_only_push.sh "$BEFORE_SHA" "$GITHUB_SHA") || docs_only=false
            if [ "$docs_only" = true ]; then
              run_build=false
            fi
          fi
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"

  mac_build:
    needs: changes
    if: needs.changes.outputs.run_build == 'true' && !contains(github.event.head_commit.message, 'skip ci')

    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      # Persist Gradle's encrypted project state separately from Gradle User Home.
      - name: Cache Gradle configuration
        if: env.GRADLE_ENCRYPTION_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.job }}

      - name: Compile Apple targets, run iOS simulator and macOS host tests, link macOS sample
        run: >
          ./gradlew
          compileKotlinIosArm64 iosSimulatorArm64Test
          macosArm64Test :sample:macos:linkDebugExecutableMacosArm64
          -Phaze.enableAppleTests
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  # The Skiko-rendered Desktop suites saturate a 4-core runner, so linux_build fans out across
  # shards and keeps its required check name as the aggregate result below.
  linux_build_shards:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run_build == 'true' && !contains(github.event.head_commit.message, 'skip ci')

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: checks
            name: linux_build (checks)
            tasks: >-
              check assembleDebug
              -x :haze-glass:jvmTest
              -x :haze-screenshot-tests:jvmTest
              -x :sample:screenshot-tests:jvmTest
              -x :haze-screenshot-tests:testAndroidHostTest
          - shard: glass-desktop-tests
            name: linux_build (Glass desktop tests)
            tasks: :haze-glass:jvmTest
          - shard: desktop-screenshots
            name: linux_build (desktop screenshots)
            tasks: >-
              :haze-screenshot-tests:verifyScreenshotMatrixJvm
              :sample:screenshot-tests:jvmTest

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Cache Gradle configuration
        if: env.GRADLE_ENCRYPTION_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Assemble and check
        run: |
          # Stream a memory trail into the step log (#1693): a runner shutdown skips post-step
          # diagnostics, but lines already streamed here survive it.
          (
            while true; do
              echo "[mem] $(date -u +%T) $(free -m | awk '/^Mem:/ { printf "used=%sMB avail=%sMB", $3, $7 } /^Swap:/ { printf " swap=%sMB", $3 }')" \
                "top: $(ps -eo rss=,comm= --sort=-rss | head -4 | awk '{ printf "%s=%dMB ", $2, $1 / 1024 }')"
              sleep 15
            done
          ) &
          trap 'kill $!' EXIT
          ./gradlew ${{ matrix.tasks }} -Phaze.disableAppleTargets -Pandroidx.baselineprofile.skipgeneration
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Install Desktop display prerequisites
        if: matrix.shard == 'checks'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      # See docs/agents/desktop-window-tests.md for prerequisites, commands, and coverage limits.
      - name: Verify real Desktop window rendering
        if: matrix.shard == 'checks'
        run: >
          SKIKO_RENDER_API=SOFTWARE xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp'
          ./gradlew :haze:verifyDesktopWindowTests -Phaze.disableAppleTargets

      - name: Upload reports + Roborazzi outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-reports-${{ matrix.shard }}
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**
            haze/build/test-results/desktopWindowTest/**
            haze/build/outputs/desktop-window-tests/**

  # Required check: keep this job name. `always()` turns a failed or cancelled shard into a
  # failure here rather than a skipped (and therefore passing) check.
  linux_build:
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.run_build == 'true' && !contains(github.event.head_commit.message, 'skip ci')
    needs:
      - changes
      - linux_build_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check linux_build shards
        env:
          SHARDS_RESULT: ${{ needs.linux_build_shards.result }}
        run: test "$SHARDS_RESULT" = success

  screenshot_tests:
    name: Screenshot tests (android)
    needs: changes
    if: needs.changes.outputs.run_build == 'true' && !contains(github.event.head_commit.message, 'skip ci')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Cache Gradle configuration
        if: env.GRADLE_ENCRYPTION_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Run screenshot tests
        run: >
          ./gradlew :haze-screenshot-tests:verifyScreenshotMatrixAndroid
          -Phaze.disableAppleTargets
          -Pandroidx.baselineprofile.skipgeneration
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Upload reports + Roborazzi outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: haze-screenshot-android-reports
          path: |
            haze-screenshot-tests/build/reports/**
            haze-screenshot-tests/build/outputs/roborazzi/**

  emulator_tests_matrix:
    needs: changes
    # No job-level `if`: a skipped matrix job never expands, so the required
    # `emulator_tests_matrix (31)` and `(34)` checks would stay pending. Gate each step instead.
    env:
      RUN_EMULATOR_TESTS: ${{ needs.changes.outputs.run_build == 'true' && !contains(github.event.head_commit.message, 'skip ci') }}

    strategy:
      fail-fast: false
      matrix:
        # API 30 runs the RenderScript Blur path: its assumeTrue(SDK_INT == 30) and
        # @SdkSuppress(maxSdkVersion = 30) device tests only run there.
        api-level: [30, 31, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        if: env.RUN_EMULATOR_TESTS == 'true'

      - name: Setup JDK
        if: env.RUN_EMULATOR_TESTS == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: env.RUN_EMULATOR_TESTS == 'true'
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Cache Gradle configuration
        if: env.RUN_EMULATOR_TESTS == 'true' && (env.GRADLE_ENCRYPTION_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ matrix.api-level }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ matrix.api-level }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Enable KVM
        if: env.RUN_EMULATOR_TESTS == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        if: env.RUN_EMULATOR_TESTS == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-snapshot-save
          script: ./gradlew connectedDebugAndroidTest connectedAndroidDeviceTest -Phaze.disableAppleTargets -Pandroidx.baselineprofile.skipgeneration

      - name: Upload instrumentation reports
        if: always() && env.RUN_EMULATOR_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/reports/tests/**
            **/build/outputs/androidTest-results/**

  emulator_tests:
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.run_build == 'true' && !contains(github.event.head_commit.message, 'skip ci')
    needs:
      - changes
      - emulator_tests_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check emulator matrix
        env:
          MATRIX_RESULT: ${{ needs.emulator_tests_matrix.result }}
        run: test "$MATRIX_RESULT" = success

  deploy:
    if: needs.changes.outputs.run_build == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1')

    runs-on: macos-26
    needs:
      - changes
      - linux_build
      - mac_build
      - screenshot_tests
      - emulator_tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.job }}

      - name: Deploy to Sonatype
        run: ./gradlew publish --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: true
