name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v1
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac_build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Compile Apple targets, run iOS simulator and macOS host tests, link macOS sample
        run: >
          ./gradlew
          compileKotlinIosArm64 iosSimulatorArm64Test
          macosArm64Test :sample:macos:linkDebugExecutableMacosArm64
          -Phaze.enableAppleTests
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  linux_build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Assemble and check
        timeout-minutes: 50
        run: >
          ./gradlew check assembleDebug :haze-screenshot-tests:verifyScreenshotMatrixJvm
          --console=plain --init-script .github/ci-test-progress.init.gradle.kts
          -x :haze-screenshot-tests:testAndroidHostTest
          -Phaze.disableAppleTargets
          -Pandroidx.baselineprofile.skipgeneration
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Install Desktop display prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      # See docs/agents/desktop-window-tests.md for prerequisites, commands, and coverage limits.
      - name: Verify real Desktop window rendering
        run: >
          SKIKO_RENDER_API=SOFTWARE xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp'
          ./gradlew :haze:verifyDesktopWindowTests -Phaze.disableAppleTargets

      - name: Upload reports + Roborazzi outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/roborazzi/**
            haze/build/test-results/desktopWindowTest/**
            haze/build/outputs/desktop-window-tests/**

  screenshot_tests_matrix:
    name: Screenshot tests (android, ${{ matrix.partition }})
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: depth-content
            task: :haze-screenshot-tests:testAndroidHostTest
          - partition: remaining
            task: :haze-screenshot-tests:verifyScreenshotMatrixAndroid
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Run screenshot tests
        timeout-minutes: 50
        run: >
          ./gradlew ${{ matrix.task }}
          --console=plain --init-script .github/ci-test-progress.init.gradle.kts
          -Phaze.androidScreenshotPartition=${{ matrix.partition }}
          -Phaze.disableAppleTargets
          -Pandroidx.baselineprofile.skipgeneration
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}

      - name: Upload reports + Roborazzi outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: haze-screenshot-android-reports-${{ matrix.partition }}
          path: |
            haze-screenshot-tests/build/reports/**
            haze-screenshot-tests/build/test-results/**
            haze-screenshot-tests/build/outputs/roborazzi/**

  screenshot_tests:
    name: Screenshot tests (android)
    if: always() && !contains(github.event.head_commit.message, 'skip ci')
    needs: screenshot_tests_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check screenshot partitions
        env:
          MATRIX_RESULT: ${{ needs.screenshot_tests_matrix.result }}
        run: test "$MATRIX_RESULT" = success

  emulator_tests_matrix:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-snapshot-save
          script: ./gradlew connectedDebugAndroidTest connectedAndroidDeviceTest -Phaze.disableAppleTargets -Pandroidx.baselineprofile.skipgeneration

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/reports/tests/**
            **/build/outputs/androidTest-results/**

  emulator_tests:
    if: always() && !contains(github.event.head_commit.message, 'skip ci')
    needs: emulator_tests_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check emulator matrix
        env:
          MATRIX_RESULT: ${{ needs.emulator_tests_matrix.result }}
        run: test "$MATRIX_RESULT" = success

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1'

    runs-on: macos-26
    needs:
      - linux_build
      - mac_build
      - screenshot_tests
      - emulator_tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Deploy to Sonatype
        run: ./gradlew publish --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: true
