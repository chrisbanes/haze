name: Desktop Glass Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'haze/**'
      - 'haze-utils/**'
      - 'haze-glass/**'
      - 'haze-materials/**'
      - 'sample/shared/**'
      - 'internal/benchmark-desktop/**'
      - 'haze-benchmarks/glass/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/desktop-glass-benchmark*.yml'
      - '.github/scripts/desktop-glass-benchmark-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package benchmark
        run: |
          ./gradlew :haze-benchmarks:glass:desktop:packageUberJarForCurrentOS --no-configuration-cache
          ./gradlew --stop

      - name: Run benchmark
        env:
          SKIKO_RENDER_API: METAL
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-glass-benchmark"
          java -Xms512m -Xmx512m \
            -jar haze-benchmarks/glass/desktop/build/compose/jars/desktop-macos-arm64-1.0.0.jar \
            --commit-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/desktop-glass-benchmark/benchmark.json"

      - name: Upload benchmark
        uses: actions/upload-artifact@v7
        with:
          name: desktop-glass-benchmark
          path: ${{ runner.temp }}/desktop-glass-benchmark/benchmark.json
          if-no-files-found: error
          retention-days: 30
