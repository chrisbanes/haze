name: Publish docs

on:
  push:
    tags:
      - '*'
  pull_request:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Docs version to deploy'
        required: true
        type: string
      aliases:
        description: 'Optional comma-separated aliases to deploy, such as latest or dev'
        required: false
        type: string
      delete_old_versions:
        description: 'Delete old docs versions after deployment'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_docs:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: macos-26
    env:
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          brew install cairo freetype libffi libjpeg libpng zlib
          python3 -m pip install --upgrade pip
          python3 -m pip install -r pip-requirements.txt

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Persist Gradle's encrypted project state separately from Gradle User Home.
      - name: Cache Gradle configuration
        if: env.GRADLE_ENCRYPTION_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: gradle-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.job }}

      - name: Build docs
        run: ./scripts/build_docs.sh build
        env:
          ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
          ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
          ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
          ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          retention-days: 1
          path: |
            docs/
            !docs/agents/**
            !docs/specs/**
            !docs/superpowers/**

  deploy_docs:
    runs-on: macos-26
    needs: build_docs
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: https://chrisbanes.github.io/haze/
    env:
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          brew install cairo freetype libffi libjpeg libpng zlib
          python3 -m pip install --upgrade pip
          python3 -m pip install -r pip-requirements.txt

      - name: Get Docs Version
        run: grep --color=never VERSION_NAME gradle.properties >> "$GITHUB_OUTPUT"
        id: version

      - name: Resolve docs deployment
        id: docs
        env:
          INPUT_DOCS_VERSION: ${{ inputs.version }}
          INPUT_DOCS_ALIASES: ${{ inputs.aliases }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            docs_version="$INPUT_DOCS_VERSION"
            docs_aliases="$INPUT_DOCS_ALIASES"
          elif echo "$VERSION_NAME" | grep --quiet "SNAPSHOT"; then
            docs_version="dev"
            docs_aliases=""
          else
            docs_version="$VERSION_NAME"
            docs_aliases="latest"
          fi

          docs_version="$(printf '%s' "$docs_version" | xargs)"
          docs_aliases="$(printf '%s' "$docs_aliases" | tr ',' ' ' | xargs)"

          if [ -z "$docs_version" ]; then
            echo "Docs version must not be blank"
            exit 1
          fi

          case "$docs_version" in
            *[!a-zA-Z0-9._-]*)
              echo "Docs version contains invalid characters: $docs_version"
              exit 1
              ;;
          esac

          for docs_alias in $docs_aliases; do
            case "$docs_alias" in
              *[!a-zA-Z0-9._-]*)
                echo "Docs alias contains invalid characters: $docs_alias"
                exit 1
                ;;
            esac
          done

          echo "version=$docs_version" >> "$GITHUB_OUTPUT"
          echo "aliases=$docs_aliases" >> "$GITHUB_OUTPUT"

      - name: Remove checkout docs directory
        run: rm -rf docs

      - name: Download docs builds
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs

      - name: Configure git for mike
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin gh-pages --depth=1

      - name: Deploy docs with mike 🗿
        env:
          DOCS_ALIASES: ${{ steps.docs.outputs.aliases }}
          HAZE_VERSION: ${{ steps.docs.outputs.version }}
        run: |
          read -r -a docs_aliases <<< "$DOCS_ALIASES"
          mike deploy -u "$HAZE_VERSION" "${docs_aliases[@]}"

      - name: Delete old doc versions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.delete_old_versions }}
        run: scripts/delete_old_version_docs.sh

      - name: Push docs deployment
        run: git push origin gh-pages
