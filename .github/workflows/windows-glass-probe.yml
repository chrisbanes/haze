name: Windows Glass shader investigation
on:
  push:
    branches: [cb/simplify-issue-1260-shader]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      SKIKO_RENDER_API: DIRECT3D
      SKIKO_HARDWARE_INFO_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Graphics environment
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
      - name: Fresh-process ABBA comparison on the same runner
        shell: pwsh
        run: |
          $variants = @('original', 'guarded', 'guarded', 'original')
          for ($trial = 0; $trial -lt $variants.Length; $trial++) {
            ./gradlew.bat :haze-glass:jvmTest --tests '*WindowsGlassProbeTest' "-PglassProbeVariant=$($variants[$trial])" "-PglassProbeTrial=$trial" '-Phaze.disableAppleTargets' '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' '-Pkotlin.daemon.jvmargs=-Xmx2g' --max-workers=2 --no-scan --console=plain
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-glass-probe
          path: |
            haze-glass/build/outputs/glass-probe
            haze-glass/build/test-results/jvmTest
