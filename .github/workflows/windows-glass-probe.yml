name: Windows Glass first-draw investigation
on:
  workflow_dispatch:
  push:
    branches: [cb/review-1767]
    paths:
      - .github/workflows/windows-glass-probe.yml
      - scripts/windows-glass-probe.ps1
      - haze-glass/**
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Record environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          java -version
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
          New-Item -ItemType Directory -Force haze-glass/build/outputs | Out-Null
          $tools = @(Get-Command wpr, wpaexporter, xperf, cdb -ErrorAction SilentlyContinue | Select-Object Name, Source)
          $tools | ConvertTo-Json | Set-Content haze-glass/build/outputs/glass-probe-profiler-tools.json
          $wpr = Get-Command wpr -ErrorAction SilentlyContinue
          if ($null -ne $wpr) {
            & $wpr.Source -profiles 2>&1 | Set-Content haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            if ($LASTEXITCODE -ne 0) { Write-Output 'WPR profile enumeration failed; inspect retained diagnostics' }
          }
          exit 0
      - name: Compile probe and check variant selection
        shell: pwsh
        run: ./gradlew.bat :haze-glass:prepareWindowsGlassProbe :haze-glass:jvmTest --tests '*WindowsGlassProbeTest' '-Phaze.disableAppleTargets' --no-scan --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Reject ambiguous profiling requests before native recording
        shell: pwsh
        run: |
          pwsh -File scripts/windows-glass-probe.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Cold/warm diagnostic self-check failed' }
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant baseline -Trials 1
          if ($LASTEXITCODE -ne 2) { throw 'Profiling argument errors must be INVALID, not a latency failure' }
          exit 0
      - name: Calibrate cold/warm signal and re-minimize remaining features
        shell: pwsh
        run: |
          $kept = @('ambient', 'content-normal', 'chroma', 'member-optics', 'sample-offset', 'grading', 'tint', 'edge-fade', 'signed-distance', 'optical-height', 'rect-gradient', 'compact-main')
          $candidates = @('refraction', 'member-weights', 'standalone-refraction', 'merged-refraction', 'merged-gradient')
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Diagnose -Variant control -Width 64 -Height 48
          if ($LASTEXITCODE -ne 0) { throw 'Cold/warm control failed' }
          $ledger = @()
          function Invoke-Diagnostic([string]$Cuts) {
            $before = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse).FullName
            pwsh -File scripts/windows-glass-probe.ps1 -Mode Diagnose -Variant original -Continuous true -Width 64 -Height 48 -Cuts $Cuts | ForEach-Object { Write-Host $_ }
            $probeExit = $LASTEXITCODE
            if ($probeExit -notin @(0, 1)) { throw 'Invalid diagnostic case' }
            $added = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse | Where-Object { $_.FullName -notin $before })
            if ($added.Count -ne 1) { throw 'Missing diagnostic result set' }
            $rows = @(Get-Content $added[0].FullName -Raw | ConvertFrom-Json)
            if ($rows.Count -ne 3) { throw 'Incomplete diagnostic trials' }
            $stalls = @($rows | Where-Object coldStall -eq $true).Count
            if ($stalls -notin @(0, 3)) { throw 'Diagnostic is unstable; stop before profiling' }
            return @{ stalled = ($stalls -eq 3); results = $added[0].FullName }
          }
          # Child output goes to the host; the function returns only its structured verdict.
          foreach ($cut in @('seed') + $candidates) {
            $proposal = @($kept)
            if ($cut -ne 'seed') { $proposal += $cut }
            $outcome = Invoke-Diagnostic ($proposal -join ',')
            if ($cut -eq 'seed' -and -not $outcome.stalled) { throw 'Cold stall was not recovered' }
            if ($outcome.stalled) { $kept = $proposal; $decision = 'KEEP_CUT' } else { $decision = 'RESTORE_FEATURE' }
            $ledger += @{ cut = $cut; proposed = $proposal; decision = $decision; kept = @($kept); results = $outcome.results }
            ConvertTo-Json -InputObject @($ledger) -Depth 5 | Set-Content haze-glass/build/outputs/glass-probe/cold-cut-ledger.json
          }
          foreach ($cut in $candidates | Where-Object { $_ -notin $kept }) {
            $outcome = Invoke-Diagnostic ((@($kept) + @($cut)) -join ',')
            if ($outcome.stalled) { throw "Final boundary $cut still reducible; stop before profiling" }
          }
          ($kept -join ',') | Set-Content haze-glass/build/outputs/glass-probe/kept-cuts.txt
          exit 0
      - name: Capture native CPU and wait stacks for minimized case and refraction-free control
        shell: pwsh
        run: |
          $cuts = (Get-Content haze-glass/build/outputs/glass-probe/kept-cuts.txt -Raw).Trim()
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant original -Continuous true -Width 64 -Height 48 -Trials 1 -Cuts $cuts
          if ($LASTEXITCODE -ne 1) { throw 'Profiled minimized case did not preserve the latency failure' }
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant original -Continuous true -Width 64 -Height 48 -Trials 1 -Cuts ($cuts + ',refraction')
          if ($LASTEXITCODE -ne 0) { throw 'Profiled refraction-free control failed' }
          $traces = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter cpu.etl -Recurse)
          if ($traces.Count -ne 2) { throw 'Expected two complete native captures' }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-glass-first-draw
          path: |
            haze-glass/build/outputs/glass-probe
            haze-glass/build/outputs/glass-probe-profiler-tools.json
            haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            haze-glass/build/test-results/jvmTest
