name: Windows Glass first-draw investigation
on:
  workflow_dispatch:
    inputs:
      skiko_baseline:
        description: Skiko version that reproduced the stall
        default: '0.150.2'
        type: string
      skiko_candidate:
        description: Skiko version to compare
        default: '0.156.1'
        type: string
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Record environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          java -version
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
          New-Item -ItemType Directory -Force haze-glass/build/outputs | Out-Null
          $tools = @(Get-Command wpr, wpaexporter, xperf, cdb -ErrorAction SilentlyContinue | Select-Object Name, Source)
          $tools | ConvertTo-Json | Set-Content haze-glass/build/outputs/glass-probe-profiler-tools.json
          $wpr = Get-Command wpr -ErrorAction SilentlyContinue
          if ($null -ne $wpr) {
            & $wpr.Source -profiles 2>&1 | Set-Content haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            if ($LASTEXITCODE -ne 0) { Write-Output 'WPR profile enumeration failed; inspect retained diagnostics' }
          }
          exit 0
      - name: Compile probe and check variant selection
        shell: pwsh
        run: ./gradlew.bat :haze-glass:prepareWindowsGlassProbe :haze-glass:jvmTest --tests '*WindowsGlassProbeTest' '-Phaze.disableAppleTargets' --no-scan --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Reject ambiguous profiling requests before native recording
        shell: pwsh
        run: |
          pwsh -File scripts/windows-glass-probe.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Cold/warm diagnostic self-check failed' }
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant baseline -Trials 1
          if ($LASTEXITCODE -ne 2) { throw 'Profiling argument errors must be INVALID, not a latency failure' }
          exit 0
      - name: Recheck native control and retained cold stall
        shell: pwsh
        run: |
          $cuts = 'ambient,content-normal,chroma,member-optics,sample-offset,grading,tint,edge-fade,signed-distance,optical-height,rect-gradient,compact-main,member-weights,standalone-refraction'
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Diagnose -Variant control -Width 64 -Height 48
          if ($LASTEXITCODE -ne 0) { throw 'Native control failed' }
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Diagnose -Variant original -Continuous true -Width 64 -Height 48 -Cuts $cuts
          if ($LASTEXITCODE -ne 1) { throw 'Retained cold stall no longer reproduces' }
          $rows = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json })
          if (@($rows | Where-Object coldStall -eq $true).Count -ne 3) { throw 'Retained cold signal is not repeatable' }
          exit 0
      - name: Capture first-draw stacks for retained, control and original continuous sources
        shell: pwsh
        run: |
          $cuts = 'ambient,content-normal,chroma,member-optics,sample-offset,grading,tint,edge-fade,signed-distance,optical-height,rect-gradient,compact-main,member-weights,standalone-refraction'
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant original -Continuous true -Width 64 -Height 48 -Trials 1 -Cuts $cuts
          if ($LASTEXITCODE -ne 1) { throw 'Profiled retained case did not preserve the cold stall' }
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant original -Continuous true -Width 64 -Height 48 -Trials 1 -Cuts ($cuts + ',refraction')
          if ($LASTEXITCODE -ne 0) { throw 'Profiled refraction-free control failed' }
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant original -Continuous true -Trials 1
          if ($LASTEXITCODE -ne 1) { throw 'Original continuous source did not preserve the cold stall' }
          exit 0
      - name: Package and validate standalone upstream reproducer outside checkout
        shell: pwsh
        run: |
          ./gradlew.bat :haze-glass:packageWindowsGlassRepro '-Phaze.disableAppleTargets' --no-scan --console=plain --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw 'Could not package standalone reproducer' }
          $repro = Join-Path $env:RUNNER_TEMP 'windows-glass-repro'
          Expand-Archive haze-glass/build/outputs/windows-glass-repro.zip $repro
          Push-Location $repro
          try {
            ./gradlew.bat installDist --no-scan --console=plain --max-workers=2
            if ($LASTEXITCODE -ne 0) { throw 'Standalone compilation failed' }
            $watchdogScript = Join-Path $repro 'watchdog-test.ps1'
            (Get-Content run.ps1 -Raw).Replace('WaitForExit(60000)', 'WaitForExit(1)') | Set-Content $watchdogScript
            pwsh -File $watchdogScript
            if ($LASTEXITCODE -ne 2) { throw 'Forced watchdog must be INVALID' }
            if (@(Get-ChildItem build/results -Filter stdout.txt -Recurse).Count -ne 1 -or
                @(Get-ChildItem build/results -Filter stderr.txt -Recurse).Count -ne 1) {
              throw 'Forced watchdog discarded captured process streams'
            }
            Remove-Item $watchdogScript
            pwsh -File run.ps1
            if ($LASTEXITCODE -ne 1) { throw 'Standalone reduced cold stall did not reproduce' }
          } finally {
            Pop-Location
            Copy-Item "$repro/build/results" haze-glass/build/outputs/glass-probe/standalone -Recurse -ErrorAction Continue
          }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-glass-first-draw
          path: |
            haze-glass/build/outputs/glass-probe
            haze-glass/build/outputs/glass-probe-profiler-tools.json
            haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            haze-glass/build/test-results/jvmTest
            haze-glass/build/outputs/windows-glass-repro.zip

  # Standalone reproducer only, so Compose's Skiko pin does not apply. Versions alternate per trial in
  # matrix order; each run.ps1 case is a fresh JVM. Fresh JVMs and VMs do not prove empty OS/driver caches.
  compare-skiko:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
    env:
      BASELINE: ${{ inputs.skiko_baseline }}
      CANDIDATE: ${{ inputs.skiko_candidate }}
      ORDER: ${{ matrix.order }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Record environment
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force compare
          git rev-parse HEAD | Set-Content "$out/head.txt"
          "image=$env:ImageOS $env:ImageVersion`norder=$env:ORDER`nbaseline=$env:BASELINE`ncandidate=$env:CANDIDATE" | Set-Content "$out/environment.txt"
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List | Out-File "$out/adapters.txt"
          java -version 2>&1 | Out-File "$out/java.txt"
          Get-Content "$out/environment.txt", "$out/adapters.txt"
      - name: Install the reproducer once per Skiko version
        shell: pwsh
        run: |
          ./gradlew.bat :haze-glass:packageWindowsGlassRepro '-Phaze.disableAppleTargets' --no-scan --console=plain --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw 'Could not package standalone reproducer' }
          foreach ($version in @($env:BASELINE, $env:CANDIDATE)) {
            $repro = Join-Path $env:RUNNER_TEMP "repro-$version"
            Expand-Archive haze-glass/build/outputs/windows-glass-repro.zip $repro
            Push-Location $repro
            try {
              ./gradlew.bat installDist "-PskikoVersion=$version" --no-scan --console=plain --max-workers=2
              if ($LASTEXITCODE -ne 0) { throw "Could not install Skiko $version" }
              ./gradlew.bat dependencies --configuration runtimeClasspath "-PskikoVersion=$version" --no-scan --console=plain |
                Out-File "$env:GITHUB_WORKSPACE/compare/dependencies-$version.txt"
              if ($LASTEXITCODE -ne 0) { throw "Could not record dependencies for Skiko $version" }
              $jars = @(Get-ChildItem build/install/windows-glass-repro/lib -Name)
              $jars | Out-File "$env:GITHUB_WORKSPACE/compare/lib-$version.txt"
              $skiko = @($jars | Where-Object { $_ -like 'skiko-*' })
              if ($skiko.Count -eq 0 -or @($skiko | Where-Object { $_ -notlike "*-$version.jar" }).Count -ne 0) {
                throw "Installed Skiko jars do not match ${version}: $skiko"
              }
            } finally { Pop-Location }
          }
      - name: Run alternating trials
        shell: pwsh
        run: |
          $versions = if ($env:ORDER -eq 'baseline-first') { @($env:BASELINE, $env:CANDIDATE) } else { @($env:CANDIDATE, $env:BASELINE) }
          for ($trial = 0; $trial -lt 3; $trial++) {
            foreach ($version in $versions) {
              $repro = Join-Path $env:RUNNER_TEMP "repro-$version"
              $out = New-Item -ItemType Directory -Force "compare/trial-$trial/$version"
              Write-Output "order=$env:ORDER trial=$trial skiko=$version"
              pwsh -File "$repro/run.ps1" -Install "$repro/build/install/windows-glass-repro" -ExpectedSkiko $version `
                -Cases 'control,retained,original' -Trials 1 -Output $out.FullName
              "$LASTEXITCODE" | Set-Content "$out/exit.txt"
            }
          }
          exit 0
      - name: Aggregate verdict
        if: always()
        shell: pwsh
        run: |
          $hashes = [ordered]@{}
          Get-ChildItem docs/agents/investigations/1767-repro/src/main/resources | ForEach-Object {
            $hashes[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $rows = @(); $invalid = @()
          foreach ($exit in @(Get-ChildItem compare -Filter exit.txt -Recurse)) {
            $version = $exit.Directory.Name
            $trial = [int]$exit.Directory.Parent.Name.Substring(6)
            $code = (Get-Content $exit.FullName -Raw).Trim()
            $results = Join-Path $exit.DirectoryName 'results.json'
            $parsed = @(if (Test-Path $results) { Get-Content $results -Raw | ConvertFrom-Json })
            if ($code -notin @('0', '1') -or $parsed.Count -ne 3) {
              $invalid += "trial $trial Skiko ${version}: run.ps1 exit $code with $($parsed.Count)/3 rows"
            }
            foreach ($row in $parsed) {
              $case = Join-Path $exit.DirectoryName "$($row.case)-0"
              $identity = Get-Content "$case/identity.txt"
              $rows += [pscustomobject]@{
                order = $env:ORDER; trial = $trial; version = $row.version
                skia = @($identity | Where-Object { $_ -like 'skia=*' })[0].Substring(5)
                case = $row.case; constructionMs = $row.constructionMs; firstDrawMs = $row.firstDrawMs
                warmMedianMs = $row.warmMedianMs; verdict = $row.verdict; reason = $row.reason
                renderer = if (Test-Path "$case/renderer.txt") { (Get-Content "$case/renderer.txt") -join ' | ' } else { '' }
              }
            }
          }
          function Count($version, $case, $verdict) {
            @($rows | Where-Object { $_.version -eq $version -and $_.case -eq $case -and $_.verdict -eq $verdict }).Count
          }
          foreach ($version in @($env:BASELINE, $env:CANDIDATE)) {
            $stalls = Count $version 'retained' 'stall'
            if ($stalls -notin @(0, 3)) { $invalid += "Skiko ${version}: mixed retained verdicts ($stalls/3 stall)" }
          }
          $reasons = @()
          if ((Count $env:BASELINE 'retained' 'stall') -ne 3) { $reasons += "baseline $env:BASELINE retained stalls $(Count $env:BASELINE 'retained' 'stall')/3 (drift)" }
          if ((Count $env:CANDIDATE 'control' 'pass') -ne 3) { $reasons += "candidate controls valid $(Count $env:CANDIDATE 'control' 'pass')/3" }
          $candidateStalls = Count $env:CANDIDATE 'retained' 'stall'
          $candidateClear = Count $env:CANDIDATE 'retained' 'no-stall'
          $originalFast = Count $env:CANDIDATE 'original' 'within-5s'
          $verdict = if ($reasons.Count -eq 0 -and $candidateClear -eq 3 -and $originalFast -eq 3) { 'changed' }
            elseif ((Count $env:CANDIDATE 'control' 'pass') -eq 3 -and $candidateStalls -eq 3) { 'persists' }
            else { 'inconclusive' }
          if ($verdict -eq 'inconclusive') {
            $reasons += "candidate retained stall $candidateStalls/3, no-stall $candidateClear/3; originals within 5 s $originalFast/3"
          }
          $summary = [ordered]@{
            order = $env:ORDER; baseline = $env:BASELINE; candidate = $env:CANDIDATE; verdict = $verdict
            reasons = $reasons; invalid = $invalid; fixtures = $hashes; rows = $rows
            cacheLimit = 'Fresh JVMs and a fresh VM do not prove empty OS, driver or compiler caches.'
          }
          ConvertTo-Json -InputObject $summary -Depth 4 | Set-Content compare/comparison.json
          $md = @("## Skiko comparison ($env:ORDER): $verdict", '', "Reasons: $($reasons -join '; ')", "INVALID: $($invalid -join '; ')", '',
            '| trial | version | skia | case | construction ms | first draw ms | warm median ms | verdict | reason |',
            '| ---: | --- | --- | --- | ---: | ---: | ---: | --- | --- |')
          $md += @($rows | Sort-Object trial, version, case | ForEach-Object {
            "| $($_.trial) | $($_.version) | $($_.skia) | $($_.case) | $($_.constructionMs) | $($_.firstDrawMs) | $($_.warmMedianMs) | $($_.verdict) | $($_.reason) |"
          })
          $md += @('', 'Renderers: ' + (@($rows.renderer | Sort-Object -Unique) -join '; '), '', 'Fixture SHA-256:')
          $md += @($hashes.Keys | ForEach-Object { "- ``$_`` $($hashes[$_])" })
          $md | Set-Content compare/comparison.md
          $md | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($invalid.Count -gt 0) { throw "INVALID harness conditions: $($invalid -join '; ')" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-glass-skiko-compare-${{ matrix.order }}
          path: |
            compare
            haze-glass/build/outputs/windows-glass-repro.zip

  # T4 ownership probe: one bounded run, separate from compare-skiko's acceptance timings.
  profile-compiler:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      BASELINE: ${{ inputs.skiko_baseline }}
      CANDIDATE: ${{ inputs.skiko_candidate }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the reproducer once per Skiko version
        shell: pwsh
        run: |
          ./gradlew.bat :haze-glass:packageWindowsGlassRepro '-Phaze.disableAppleTargets' --no-scan --console=plain --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw 'Could not package standalone reproducer' }
          foreach ($version in @($env:BASELINE, $env:CANDIDATE)) {
            $repro = Join-Path $env:RUNNER_TEMP "repro-$version"
            Expand-Archive haze-glass/build/outputs/windows-glass-repro.zip $repro
            Push-Location $repro
            try {
              ./gradlew.bat installDist "-PskikoVersion=$version" --no-scan --console=plain --max-workers=2
              if ($LASTEXITCODE -ne 0) { throw "Could not install Skiko $version" }
            } finally { Pop-Location }
          }
      - name: Capture D3DCompile calls and recompile captured HLSL
        shell: pwsh
        run: |
          $frida = Join-Path $env:RUNNER_TEMP 'frida'
          python -m pip install --disable-pip-version-check --target $frida frida==17.24.3
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Frida' }
          $env:PYTHONPATH = $frida
          python "$env:RUNNER_TEMP/repro-$env:BASELINE/d3dcompile.py" profile $env:RUNNER_TEMP d3dcompile $env:BASELINE $env:CANDIDATE
          if ($LASTEXITCODE -ne 0) { throw 'D3DCompile profile failed' }
          Get-Content d3dcompile/profile.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-glass-d3dcompile
          path: d3dcompile
