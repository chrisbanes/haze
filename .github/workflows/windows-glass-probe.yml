name: Windows Glass first-draw investigation
on:
  workflow_dispatch:
  push:
    branches: [cb/review-1767]
    paths:
      - .github/workflows/windows-glass-probe.yml
      - scripts/windows-glass-probe.ps1
      - haze-glass/**
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Record environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          java -version
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
          New-Item -ItemType Directory -Force haze-glass/build/outputs | Out-Null
          $tools = @(Get-Command wpr, wpaexporter, xperf, cdb -ErrorAction SilentlyContinue | Select-Object Name, Source)
          $tools | ConvertTo-Json | Set-Content haze-glass/build/outputs/glass-probe-profiler-tools.json
          $wpr = Get-Command wpr -ErrorAction SilentlyContinue
          if ($null -ne $wpr) {
            & $wpr.Source -profiles 2>&1 | Set-Content haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            if ($LASTEXITCODE -ne 0) { Write-Output 'WPR profile enumeration failed; inspect retained diagnostics' }
          }
          exit 0
      - name: Compile probe and check variant selection
        shell: pwsh
        run: ./gradlew.bat :haze-glass:prepareWindowsGlassProbe :haze-glass:jvmTest --tests '*WindowsGlassProbeTest' '-Phaze.disableAppleTargets' --no-scan --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Reject ambiguous profiling requests before native recording
        shell: pwsh
        run: |
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant baseline -Trials 1
          if ($LASTEXITCODE -ne 2) { throw 'Profiling argument errors must be INVALID, not a latency failure' }
          exit 0
      - name: Recheck unprofiled control and minimized failure
        shell: pwsh
        run: |
          $cuts = 'ambient,content-normal,chroma,member-optics,sample-offset,grading,tint,edge-fade,signed-distance,optical-height,rect-gradient,compact-main'
          pwsh -File scripts/windows-glass-probe.ps1 -Variant control -Width 64 -Height 48 -Trials 1
          if ($LASTEXITCODE -ne 0) { throw 'Unprofiled control failed' }
          pwsh -File scripts/windows-glass-probe.ps1 -Variant original -Continuous true -Width 64 -Height 48 -Trials 1 -Cuts $cuts
          if ($LASTEXITCODE -ne 1) { throw 'Unprofiled minimized case no longer reproduces' }
          exit 0
      - name: Capture native CPU and wait stacks for minimized case and refraction-free control
        shell: pwsh
        run: |
          $cuts = 'ambient,content-normal,chroma,member-optics,sample-offset,grading,tint,edge-fade,signed-distance,optical-height,rect-gradient,compact-main'
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant original -Continuous true -Width 64 -Height 48 -Trials 1 -Cuts $cuts
          if ($LASTEXITCODE -ne 1) { throw 'Profiled minimized case did not preserve the latency failure' }
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Profile -Variant original -Continuous true -Width 64 -Height 48 -Trials 1 -Cuts ($cuts + ',refraction')
          if ($LASTEXITCODE -ne 0) { throw 'Profiled refraction-free control failed' }
          $traces = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter cpu.etl -Recurse)
          if ($traces.Count -ne 2) { throw 'Expected two complete native captures' }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-glass-first-draw
          path: |
            haze-glass/build/outputs/glass-probe
            haze-glass/build/outputs/glass-probe-profiler-tools.json
            haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            haze-glass/build/test-results/jvmTest
