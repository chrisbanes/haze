name: Windows Glass first-draw investigation
on:
  workflow_dispatch:
  push:
    branches: [cb/review-1767]
    paths:
      - .github/workflows/windows-glass-probe.yml
      - scripts/windows-glass-probe.ps1
      - haze-glass/**
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Record environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          java -version
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
          New-Item -ItemType Directory -Force haze-glass/build/outputs | Out-Null
          $tools = @(Get-Command wpr, wpaexporter, xperf, cdb -ErrorAction SilentlyContinue | Select-Object Name, Source)
          $tools | ConvertTo-Json | Set-Content haze-glass/build/outputs/glass-probe-profiler-tools.json
          $wpr = Get-Command wpr -ErrorAction SilentlyContinue
          if ($null -ne $wpr) {
            & $wpr.Source -profiles 2>&1 | Set-Content haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            if ($LASTEXITCODE -ne 0) { Write-Output 'WPR profile enumeration failed; inspect retained diagnostics' }
          }
          exit 0
      - name: Compile probe and check variant selection
        shell: pwsh
        run: ./gradlew.bat :haze-glass:prepareWindowsGlassProbe :haze-glass:jvmTest --tests '*WindowsGlassProbeTest' '-Phaze.disableAppleTargets' --no-scan --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Run bounded fresh-process feedback loop
        shell: pwsh
        run: |
          pwsh -File scripts/windows-glass-probe.ps1 -Mode Baseline
          $probeExit = $LASTEXITCODE
          if ($probeExit -ne 1) { throw "Expected reproduced latency failure; received exit $probeExit" }
          $files = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse)
          if ($files.Count -ne 1) { throw 'Expected one complete result set' }
          $results = @(Get-Content $files[0].FullName -Raw | ConvertFrom-Json)
          if ($results.Count -ne 12) { throw 'Incomplete trials' }
          if (@($results | Where-Object { $_.variant -eq 'control' -and $_.verdict -eq 'PASS' }).Count -ne 3) { throw 'Control failed' }
          if (@($results | Where-Object { $_.variant -eq 'original' -and $_.verdict -eq 'LATENCY_FAIL' }).Count -ne 6) { throw 'Original failure is not repeatable' }
          if (@($results | Where-Object verdict -eq 'INVALID').Count -gt 0) { throw 'Invalid experiment' }
          # The probe deliberately exits 1 for latency failures; the assertions above certify reproduction.
          exit 0
      - name: Reduce draw width, then height, keeping shader and uniforms fixed
        shell: pwsh
        run: |
          function Assert-ReducedFailure([int]$Width, [int]$Height) {
            $before = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse).FullName
            pwsh -File scripts/windows-glass-probe.ps1 -Variant original -Continuous true -Width $Width -Height $Height
            if ($LASTEXITCODE -ne 1) { throw "Reduction ${Width}x${Height} did not preserve a valid latency failure" }
            $added = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse | Where-Object { $_.FullName -notin $before })
            if ($added.Count -ne 1) { throw 'Expected one reduction result set' }
            $results = @(Get-Content $added[0].FullName -Raw | ConvertFrom-Json)
            if ($results.Count -ne 3 -or @($results | Where-Object verdict -ne 'LATENCY_FAIL').Count -ne 0) { throw 'Reduction is not repeatably red' }
          }
          Assert-ReducedFailure 64 160
          Assert-ReducedFailure 64 48
          exit 0
      - name: Remove one source feature at a time, retaining only repeatable failures
        shell: pwsh
        run: |
          # Seed only cuts retained by the previous native run, with exact source in its artifacts.
          $kept = @('ambient', 'content-normal', 'chroma', 'member-optics', 'sample-offset', 'grading', 'tint', 'edge-fade', 'signed-distance', 'optical-height', 'rect-gradient')
          ($kept -join ',') | Set-Content haze-glass/build/outputs/glass-probe/seed-cuts.txt
          $ledger = @()
          foreach ($cut in @('seed', 'compact-main', 'refraction', 'member-weights', 'standalone-refraction', 'merged-refraction', 'merged-gradient')) {
            $proposal = @($kept)
            if ($cut -ne 'seed') { $proposal += $cut }
            $before = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse).FullName
            pwsh -File scripts/windows-glass-probe.ps1 -Variant original -Continuous true -Width 64 -Height 48 -Cuts ($proposal -join ',')
            $probeExit = $LASTEXITCODE
            if ($probeExit -notin @(0, 1)) { throw "Invalid reduction at $cut" }
            $added = @(Get-ChildItem haze-glass/build/outputs/glass-probe -Filter results.json -Recurse | Where-Object { $_.FullName -notin $before })
            if ($added.Count -ne 1) { throw 'Expected one source reduction result set' }
            $results = @(Get-Content $added[0].FullName -Raw | ConvertFrom-Json)
            if ($results.Count -ne 3) { throw 'Incomplete reduction trials' }
            $failed = @($results | Where-Object verdict -eq 'LATENCY_FAIL').Count
            $passed = @($results | Where-Object verdict -eq 'PASS').Count
            if ($cut -eq 'seed' -and $failed -ne 3) { throw 'Retained seed no longer reproduces; stop minimisation' }
            if ($failed -eq 3 -and $probeExit -eq 1) {
              $kept = $proposal
              $decision = 'KEEP_CUT'
            } elseif ($passed -eq 3 -and $probeExit -eq 0) {
              $decision = 'RESTORE_FEATURE'
            } else {
              throw "Unstable or invalid reduction at $cut; retain original and inspect artifacts"
            }
            $ledger += @{ cut = $cut; proposed = $proposal; decision = $decision; kept = @($kept); results = $added[0].FullName }
            ConvertTo-Json -InputObject @($ledger) -Depth 5 | Set-Content haze-glass/build/outputs/glass-probe/cut-ledger.json
            ($kept -join ',') | Set-Content haze-glass/build/outputs/glass-probe/kept-cuts.txt
            Write-Output "CUT_RESULT $cut $decision retained=$($kept -join ',')"
          }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-glass-first-draw
          path: |
            haze-glass/build/outputs/glass-probe
            haze-glass/build/outputs/glass-probe-profiler-tools.json
            haze-glass/build/outputs/glass-probe-wpr-profiles.txt
            haze-glass/build/test-results/jvmTest
